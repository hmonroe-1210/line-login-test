<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINE 外登入測試</title>
<style>
  body { font: 18px/1.5 system-ui, -apple-system, sans-serif; margin: 0; padding: 16px 16px 60px; background: #fff; color: #111; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .no { display: inline-block; background: #111; color: #fff; border-radius: 999px; padding: 2px 12px; font-size: 16px; font-weight: 700; }
  .where { font-size: 22px; font-weight: 800; margin: 10px 0 4px; }
  .what { font-size: 18px; color: #333; margin: 0 0 16px; }
  .big { display: block; width: 100%; box-sizing: border-box; padding: 22px 12px; font-size: 22px; font-weight: 800; border-radius: 14px; border: 0; background: #06c755; color: #fff; text-align: center; text-decoration: none; margin: 12px 0; }
  .big.dark { background: #111; }
  .big.gray { background: #e9e9e9; color: #111; font-size: 18px; font-weight: 600; padding: 16px 12px; text-align: left; }
  .big.gray.sel { background: #06c755; color: #fff; }
  .note { font-size: 16px; color: #555; }
  .box { border-radius: 14px; padding: 16px; margin: 12px 0; font-size: 18px; }
  .ok { background: #e7f6ec; color: #135d2b; }
  .bad { background: #fdecec; color: #9b1c14; }
  .wait { background: #fff3d6; color: #6b4600; }
  .line { font-size: 20px; margin: 6px 0; }
  .verdict { font-size: 26px; font-weight: 800; text-align: center; padding: 18px; border-radius: 14px; margin: 16px 0; }
  .card { border: 2px solid #ddd; border-radius: 14px; padding: 14px; margin: 16px 0; }
  .card h2 { font-size: 22px; margin: 0 0 8px; }
  ol { padding-left: 22px; margin: 8px 0; }
  ol li { margin: 6px 0; }
  .small { font-size: 12px; color: #888; word-break: break-all; margin-top: 24px; }
  .hide { display: none; }
</style>
</head>
<body>
<div id="app">載入中⋯⋯</div>
<div class="small" id="ua"></div>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  const LIFF_ID = '2012618116-nXrAeM9R';
  const BASE = location.origin + location.pathname;

  // 10 項測試。kind：A 在 App 裡直接登入；again 再打開一次；B 跳進 LINE
  const APPS = {
    FB: { name: 'Facebook', put: '貼到 Facebook 一則「只限本人」的貼文，發佈後在貼文裡點連結' },
    IG: { name: 'Instagram', put: '用另一個 IG 帳號私訊給自己（或請朋友私訊你），在 IG 的私訊裡點連結' },
    TT: { name: 'TikTok', put: '在 TikTok 私訊給朋友或自己的另一個帳號，在 TikTok 的私訊裡點連結' },
    WEB: { name: 'Safari 或 Chrome', put: '直接在手機的 Safari（iPhone）或 Chrome（Android）打開' },
  };
  const CASES = [
    { id: 'FB-A', n: 1, app: 'FB', kind: 'A' },
    { id: 'FB-2', n: 2, app: 'FB', kind: 'again' },
    { id: 'FB-B', n: 3, app: 'FB', kind: 'B' },
    { id: 'IG-A', n: 4, app: 'IG', kind: 'A' },
    { id: 'IG-2', n: 5, app: 'IG', kind: 'again' },
    { id: 'IG-B', n: 6, app: 'IG', kind: 'B' },
    { id: 'TT-A', n: 7, app: 'TT', kind: 'A' },
    { id: 'TT-2', n: 8, app: 'TT', kind: 'again' },
    { id: 'TT-B', n: 9, app: 'TT', kind: 'B' },
    { id: 'WEB-A', n: 10, app: 'WEB', kind: 'A' },
  ];
  const KIND = {
    A: '在這裡直接用 LINE 登入',
    again: '再打開一次，看還記不記得你',
    B: '按按鈕跳進 LINE',
  };

  const ua = navigator.userAgent;
  document.getElementById('ua').textContent = 'UA：' + ua;
  const os = /iPhone|iPad|iPod/i.test(ua) ? 'iPhone' : /Android/i.test(ua) ? 'Android' : '電腦';
  const detect = () => {
    if (/\bLine\//i.test(ua) || /LIFF/i.test(ua)) return 'LINE';
    if (/Instagram/i.test(ua)) return 'IG';
    if (/FBAN|FBAV|FB_IAB|FBIOS|\[FB/i.test(ua)) return 'FB';
    if (/musical_ly|BytedanceWebview|TikTok|trill|aweme|ByteLocale/i.test(ua)) return 'TT';
    if (/; wv\)|WebView/i.test(ua)) return '其他 App';
    return 'WEB';
  };
  const here = detect();
  const hereName = here === 'LINE' ? 'LINE 裡' : here === 'WEB' ? '一般瀏覽器（Safari 或 Chrome）' : here === '其他 App' ? '某個 App 的內建瀏覽器' : APPS[here].name + ' 裡';

  const load = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const app = document.getElementById('app');
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const linkOf = (c, extra) => {
    const u = new URL(BASE); u.searchParams.set('case', c.id); u.searchParams.set('fbclid', 'TEST-' + c.id);
    Object.entries(extra || {}).forEach(([k, v]) => u.searchParams.set(k, v)); return u.href;
  };
  const copy = async (text, btn, done) => {
    try { await navigator.clipboard.writeText(text); }
    catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
    btn.textContent = done;
  };

  // ---------- 首頁：列出 10 項，按 App 分組 ----------
  function hub() {
    let h = `<h1>LINE 外登入測試</h1>
      <p class="what">你的手機：<b>${os}</b>。一個 App 做完再換下一個，每支手機做 10 項。</p>
      <div class="box wait">每做完一項，畫面最後會有「複製結果」，貼回給 Claude（截圖也可以）。</div>`;
    ['FB', 'IG', 'TT', 'WEB'].forEach(a => {
      const cs = CASES.filter(c => c.app === a);
      const text = cs.map(c => `測試${c.n}：${KIND[c.kind]}\n${linkOf(c)}`).join('\n\n');
      h += `<div class="card"><h2>${APPS[a].name}（測試 ${cs[0].n}${cs.length > 1 ? '～' + cs[cs.length - 1].n : ''}）</h2><ol>`;
      if (a === 'WEB') {
        h += `<li>確認你現在是用 Safari（iPhone）或 Chrome（Android）打開這頁，不是在 LINE 或其他 App 裡</li><li>按下面的按鈕</li></ol>
          <a class="big dark" href="${esc(linkOf(cs[0]))}">開始測試 10</a>`;
      } else {
        h += `<li>按「複製 ${APPS[a].name} 的連結」</li><li>${APPS[a].put}</li><li>照順序點：測試 ${cs[0].n} → 測試 ${cs[1].n} → 測試 ${cs[2].n}</li>
          <li>點測試 ${cs[1].n} 之前，先把 ${APPS[a].name} 裡開著的網頁關掉</li></ol>
          <button class="big dark" data-copy="${esc(text)}">複製 ${APPS[a].name} 的連結</button>`;
      }
      h += `</div>`;
    });
    app.innerHTML = h;
    app.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(b.dataset.copy, b, '✅ 已複製，去貼上'));
  }

  // ---------- 單項測試 ----------
  function header(c) {
    return `<span class="no">測試 ${c.n}／10</span>
      <div class="where">${APPS[c.app].name}：${KIND[c.kind]}</div>`;
  }
  // 認不出是哪個 App 時（例如 TikTok 在 iPhone 上看起來和 Safari 一樣），讓使用者確認後繼續
  const forced = (c) => load('lt_force_' + c.app) === '1';
  const isHere = (c) => here === c.app || forced(c);
  function wrongPlace(c, want, go) {
    app.innerHTML = header(c) + `<div class="box bad"><div class="line"><b>❌ 打開的地方不對？</b></div>
      測試頁認為你現在是在 <b>${hereName}</b>，這一項要在 <b>${want}</b> 打開。<br><br>
      如果你不是從 ${want} 點的，請回到 ${want}，從那裡點測試 ${c.n} 的連結。</div>
      <button class="big dark" id="force">我確定是在 ${want} 點的，繼續</button>`;
    document.getElementById('force').onclick = () => { save('lt_force_' + c.app, '1'); go(); };
  }
  function result(c, checks, question, extra) {
    const allAuto = checks.every(x => x[1]);
    const lines = checks.map(([label, ok]) => `<div class="line">${ok ? '✅' : '❌'} ${label}</div>`).join('');
    app.innerHTML = header(c) + `<div class="box ${allAuto ? 'ok' : 'bad'}">${lines}${extra ? `<div class="line">⏱ ${extra}</div>` : ''}</div>
      ${question ? `<div class="card"><h2>${question.q}</h2><div id="opts"></div></div>` : ''}
      <div id="final"></div>`;
    const finish = (answer) => {
      const pass = allAuto && (!question || question.good.includes(answer));
      const text = `測試${c.n} ${c.id}｜${os}｜${pass ? '通過' : '沒通過'}｜` + checks.map(([l, ok]) => `${l}${ok ? '✅' : '❌'}`).join(' ') +
        (extra ? `｜${extra}` : '') + (answer ? `｜看到：${answer}` : '') + (forced(c) && here !== c.app ? `｜測試頁認不出 App，使用者確認是 ${APPS[c.app].name}` : '') + `｜UA：${ua}`;
      document.getElementById('final').innerHTML = `<div class="verdict ${pass ? 'ok' : 'bad'}">${pass ? '✅ 這一項通過' : '❌ 這一項沒通過'}</div>
        <button class="big dark" id="cp">📋 複製結果，貼回給 Claude</button>
        <p class="note">複製不了就直接截圖這個畫面。${c.n < 10 ? `接著做測試 ${c.n + 1}。` : '全部做完了，謝謝！'}</p>`;
      document.getElementById('cp').onclick = (e) => copy(text, e.target, '✅ 已複製，貼回給 Claude');
    };
    if (!question) return finish('');
    const box = document.getElementById('opts');
    question.opts.forEach(o => {
      const b = document.createElement('button'); b.className = 'big gray'; b.textContent = o;
      b.onclick = () => { box.querySelectorAll('button').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); finish(o); };
      box.appendChild(b);
    });
  }

  async function test(c, q) {
    const back = q.get('s') === 'back';
    const t = Number(q.get('t') || 0);
    const secs = t ? Math.round((Date.now() - t) / 1000) + ' 秒' : '';
    const fb = q.get('fbclid');
    const want = c.app === 'WEB' ? 'Safari 或 Chrome' : APPS[c.app].name + ' 裡';
    const loggedIn = liff.isLoggedIn();

    // A：在 App 裡直接登入
    if (c.kind === 'A' && !back) {
      if (!isHere(c)) return wrongPlace(c, want, () => test(c, q));
      if (loggedIn) liff.logout();  // 從登出開始
      save('lt_' + c.app, c.id);    // 記號：回來時看是不是同一個瀏覽器
      app.innerHTML = header(c) + `<div class="box ok"><div class="line">✅ 打開的地方對了：${here === c.app ? hereName : want}</div></div>
        <button class="big" id="go">👉 按這裡：用 LINE 登入</button>
        <ol class="note"><li>按下去後照畫面做。要你按「登入」、輸入帳號密碼或掃 QR code，都照做完成</li>
        <li>登入完應該會自動回到這一頁，看到結果</li>
        <li>如果停在 LINE 回不來，在 Claude 對話裡打「測試 ${c.n} 回不來」</li></ol>`;
      document.getElementById('go').onclick = () => liff.login({ redirectUri: linkOf(c, { s: 'back', t: Date.now() }) });
      return;
    }
    if (c.kind === 'A' && back) {
      return result(c, [
        ['登入成功', loggedIn],
        [`回到 ${want}`, isHere(c) && load('lt_' + c.app) === c.id],
        ['點擊參數還在', fb === 'TEST-' + c.id],
      ], { q: '剛剛登入時，畫面要你做什麼？', good: ['什麼都不用做，自動就回來了', '只要按一個「登入」或「繼續」'],
           opts: ['什麼都不用做，自動就回來了', '只要按一個「登入」或「繼續」', '要輸入 email 和密碼', '要掃 QR code', '跳去別的 App 或瀏覽器了'] }, secs);
    }

    // again：再打開一次
    if (c.kind === 'again') {
      if (!isHere(c)) return wrongPlace(c, want, () => test(c, q));
      return result(c, [
        ['做過前一項（同一個瀏覽器）', !!load('lt_' + c.app)],
        ['不用再登入就認得你', loggedIn],
      ], null);
    }

    // B：跳進 LINE
    if (c.kind === 'B' && !back) {
      if (!isHere(c)) return wrongPlace(c, want, () => test(c, q));
      app.innerHTML = header(c) + `<div class="box ok"><div class="line">✅ 打開的地方對了：${here === c.app ? hereName : want}</div></div>
        <button class="big" id="go">👉 按這裡：跳進 LINE</button>
        <ol class="note"><li>按下去後應該會打開 LINE，在 LINE 裡看到結果</li>
        <li>按了 10 秒都沒反應，在 Claude 對話裡打「測試 ${c.n} 沒跳」</li></ol>`;
      document.getElementById('go').onclick = () => {
        const u = new URL(`https://liff.line.me/${LIFF_ID}`);
        u.searchParams.set('case', c.id); u.searchParams.set('s', 'back'); u.searchParams.set('t', Date.now()); u.searchParams.set('fbclid', 'TEST-' + c.id);
        location.href = u.href;
      };
      return;
    }
    if (c.kind === 'B' && back) {
      return result(c, [
        ['已經在 LINE 裡', liff.isInClient()],
        ['認得你（不用登入）', loggedIn],
        ['點擊參數有帶進來', fb === 'TEST-' + c.id],
      ], { q: '跳進 LINE 時，畫面要你做什麼？', good: ['什麼都不用按，直接進來', '只按了一個「開啟」或「同意」'],
           opts: ['什麼都不用按，直接進來', '只按了一個「開啟」或「同意」', '要按好幾步', '其他'] }, secs);
    }
  }

  (async () => {
    try { await liff.init({ liffId: LIFF_ID }); }
    catch (e) { app.innerHTML = `<div class="box bad"><b>❌ 測試頁壞了</b><br>把這段截圖給 Claude：${esc(e.code + ' ' + e.message)}</div>`; return; }
    const q = new URLSearchParams(location.search);  // LIFF 初始化後才讀，跳進 LINE 時參數這時才回來
    const c = CASES.find(x => x.id === q.get('case'));
    c ? test(c, q) : hub();
  })();
</script>
</body>
</html>
